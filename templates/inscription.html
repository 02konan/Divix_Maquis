<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3d6dff">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/outfit/outfit.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/boxicons/boxicons.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/admin.css')}}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/login.css')}}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/maquis.css')}}" />
    <script src="{{ url_for('static', filename='vendor/sweetalert2/sweetalert2.all.min.js') }}"></script>
    <title>Ouvrir mon établissement - Divix Maquis</title>
</head>
<body class="login-body">
    <div class="toast align-items-center" role="alert" aria-live="assertive" aria-atomic="true" id="loginToast" style="position: absolute; top: 20px; left: 20px; z-index: 99;">
        <div class="d-flex">
            <div class="toast-body"></div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
    <div class="row login-container">
        <div class="col-6 img">
            <div class="d-flex w-100 align-items-center header-login-img">
                <span class="m-0 login-subtilte">Maquis</span>
                <div id="logo" class="d-flex border-0 ms-auto">
                    <img src="/static/icons/logo.svg" alt="Logo">
                </div>
            </div>
        </div>
        <div class="col-6 d-flex flex-column align-items-center justify-content-center f-login">
            <div class="align-items-center header-mobile">
                <span class="m-0 text-muted">Ouvrir mon établissement</span>
            </div>
            <img src="/static/icons/icon-512.png" alt="Logo Divix Maquis" class="img-fluid mb-3" style="max-width: 160px; height: auto;">
            <p class="text-center text-muted mb-4">
                Votre maquis, sa carte et sa caisse — en quelques secondes.
            </p>
            <form action="{{ url_for('inscription') }}" method="post" class="form-login" id="inscriptionForm">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" name="etablissement" id="etablissement" placeholder="Maquis Le Baoulé" required>
                    <label for="etablissement">Nom de l'établissement</label>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-7">
                        <div class="form-floating">
                            <input type="text" class="form-control" name="ville" id="ville" placeholder="Abidjan">
                            <label for="ville">Ville</label>
                        </div>
                    </div>
                    <div class="col-5">
                        <div class="form-floating">
                            <input type="tel" class="form-control" name="telephone" id="telephone" placeholder="+225">
                            <label for="telephone">Téléphone</label>
                        </div>
                    </div>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" name="nom" id="nom" placeholder="Votre nom" required>
                    <label for="nom">Votre nom (gérant)</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" name="email" id="email" placeholder="nom@maquis.ci" required>
                    <label for="email">Adresse email</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" name="mot_de_passe" id="mot_de_passe" placeholder="Mot de passe" required>
                    <label for="mot_de_passe">Mot de passe (6 caractères minimum)</label>
                </div>
                <button type="submit" class="btn-login">Créer mon établissement</button>
                <p class="text-center text-muted small mt-3 mb-0">
                    Déjà inscrit ?
                    <a href="{{ url_for('login') }}" class="forgot-link">Se connecter</a>
                </p>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
    <script>
        const toastEl = document.getElementById('loginToast');

        function showAlert(type, message) {
            if (!toastEl) return;
            const toastBody = toastEl.querySelector('.toast-body');
            toastEl.className = 'toast align-items-center bg-white text-dark';
            const iconClass = type === 'success'
                ? 'bi-check-circle-fill text-success'
                : 'bi-exclamation-circle-fill text-danger';
            toastBody.innerHTML = `<i class="bi ${iconClass} me-2"></i>${message}`;
            bootstrap.Toast.getOrCreateInstance(toastEl).show();
        }

        const form = document.getElementById('inscriptionForm');
        const submitBtn = form.querySelector('.btn-login');
        const originalBtnText = submitBtn.innerHTML;

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const motDePasse = document.getElementById('mot_de_passe').value;
            if (motDePasse.length < 6) {
                showAlert('error', 'Le mot de passe doit faire au moins 6 caractères');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bx bx-loader-lines bx-spin me-2"></i>Création en cours...';

            try {
                const response = await fetch('{{ url_for("inscription") }}', {
                    method: 'POST',
                    body: new FormData(this)
                });
                const data = await response.json();

                if (data.success) {
                    showAlert('success', data.message);
                    setTimeout(() => { window.location.href = data.redirect; }, 1200);
                } else {
                    showAlert('error', data.error || 'Une erreur est survenue');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                }
            } catch (error) {
                console.error('Erreur:', error);
                showAlert('error', "Une erreur est survenue lors de l'inscription");
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            }
        });
    </script>
</body>
</html>
