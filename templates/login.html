<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3d6dff">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json')}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/admin.css')}}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/login.css')}}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/maquis.css')}}" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Connexion - Divix Maquis</title>
</head>
<body class="login-body">
    <div class="toast align-items-center" role="alert" aria-live="assertive" aria-atomic="true" id="loginToast" style="position: absolute; top: 20px; left: 20px; z-index: 99;">
        <div class="d-flex">
            <div class="toast-body"></div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
    <div class="row login-container">
        <div class="col-6 img">
            <div class="d-flex w-100 align-items-center header-login-img">
                <span class="m-0 login-subtilte">Maquis</span>
                <div id="logo" class="d-flex border-0 ms-auto">
                    <img src="/static/icons/logo.svg" alt="Logo">
                    
                </div>
            </div>
        </div>
        <div class="col-6 d-flex flex-column align-items-center justify-content-center f-login">
            <div class="align-items-center header-mobile">
                <span class="m-0 text-muted">Se connecter</span>
            </div>
            <img src="/static/icons/icon-512.png" alt="Logo Divix Maquis" class="img-fluid mb-3" style="max-width: 220px; height: auto;">
            <p class="text-center text-muted mb-4">Connectez-vous pour ouvrir le service</p>
            <form action="/login" method="post" class="form-login" id="loginForm">
                <div class="form-floating mb-3 mt-2">
                    <input type="email" class="form-control" name="email" id="email" placeholder="nom@maquis.ci">
                    <label for="email">Adresse email</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" name="password" id="password" placeholder="Mot de passe">
                    <label for="password">Mot de passe</label>
                </div>
                <div class="d-flex align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember" value="1" id="remember">
                        <label class="form-check-label small text-muted" for="remember">Se souvenir de moi</label>
                    </div>
                    <a href="#" class="ms-auto forgot-link">Mot de passe oublié?</a>
                </div>
                <button type="submit" class="btn-login">Se connecter</button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script>
        const toastEl = document.getElementById('loginToast');

        function showAlert(type, message) {
            if (!toastEl) return;
            const toastBody = toastEl.querySelector('.toast-body');
            toastEl.className = 'toast align-items-center bg-white text-dark';
            const iconClass = type === 'success'
                ? 'bi-check-circle-fill text-success'
                : 'bi-exclamation-circle-fill text-danger';
            toastBody.innerHTML = `<i class="bi ${iconClass} me-2"></i>${message}`;
            bootstrap.Toast.getOrCreateInstance(toastEl).show();
        }

        const loginForm = document.getElementById('loginForm');
        const submitBtn = loginForm.querySelector('.btn-login');
        const originalBtnText = submitBtn.innerHTML;

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('error', 'Veuillez remplir tous les champs');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showAlert('error', 'Veuillez entrer une adresse email valide');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bx bx-loader-circle bx-spin me-2"></i>Connexion en cours...';

            try {
                const response = await fetch('{{ url_for("login") }}', {
                    method: 'POST',
                    body: new FormData(this)
                });
                const data = await response.json();

                if (data.success) {
                    showAlert('success', data.message);
                    setTimeout(() => { window.location.href = data.redirect; }, 800);
                } else {
                    showAlert('error', data.error || 'Une erreur est survenue');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                }
            } catch (error) {
                console.error('Erreur:', error);
                showAlert('error', 'Une erreur est survenue lors de la connexion');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            }
        });
    </script>
</body>
</html>
